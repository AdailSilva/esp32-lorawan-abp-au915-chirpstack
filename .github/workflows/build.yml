# Builds the firmware of this LoRaWAN node (ESP32 DevKit + RFM95W, Arduino core).
#
#   push / pull request -> binaries as workflow artifacts, version from "git describe"
#                          (e.g. 0.0.1-3-gabc1234)
#   tag vX.Y.Z          -> GitHub Release "vX.Y.Z" with the binaries of version X.Y.Z
#   tag vX.Y.Z-rc1      -> same, marked as pre-release
#
# If the sketch has a node_build.h, NODE_FW_VERSION (boot banner, web page) is
# written from the tag at build time: nothing to edit by hand.
#
# The LMiC library is cloned from LMIC_REPO, gets the hal_init fix for ESP32
# core 3.x (idempotent) and a lmic_project_config.h with AU915 + SX1276.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  SKETCH: LoRaWAN_Node_Base_ABP                 # folder name == main .ino name
  PKG: lorawan-node-abp                       # prefix of the binaries / release files
  LMIC_REPO: https://github.com/AdailSilva/IBM-LMIC-LoRaWAN-MAC-in-C-library-v3.3.0.git
  LMIC_VERSION: "3.3.0"
  ESP32_CORE: "3.3.12"
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags and history for git describe

      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH (e.g. v1.2.0 or v1.2.0-rc1)"
              exit 1
            fi
            ver="${tag#v}"
            release=true
            case "$ver" in *-*) pre=true ;; *) pre=false ;; esac
          else
            # no tag yet -> git describe exits 128; "|| true" keeps pipefail from killing the job
            ver=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)
            ver="${ver#v}"
            [ -n "$ver" ] || ver="0.0.0-dev+$(git rev-parse --short HEAD)"
            release=false
            pre=false
          fi
          echo "version=$ver"       >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"    >> "$GITHUB_OUTPUT"
          echo "### Firmware version: \`$ver\`" >> "$GITHUB_STEP_SUMMARY"

  firmware:
    name: ${{ matrix.board }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            board: ESP32-DevKit_RFM95W
            fqbn: esp32:esp32:esp32:PartitionScheme=default,FlashMode=dio,FlashFreq=40,FlashSize=4M
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.SKETCH }}   # arduino-cli: sketch folder must match the .ino

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE }}

      - name: ESP32 core
        shell: bash
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      - name: LMiC library
        shell: bash
        run: |
          lib="$RUNNER_TEMP/libraries/MCCI_LoRaWAN_LMIC_library"
          git clone --depth 1 "$LMIC_REPO" "$lib"
          grep -q "^version=$LMIC_VERSION\$" "$lib/library.properties" || {
            echo "::error::$LMIC_REPO is not LMiC $LMIC_VERSION"; grep '^version=' "$lib/library.properties"; exit 1; }

          # ESP32 core 3.x also defines hal_init -> "multiple definition of 'hal_init'".
          # Rename the LMiC one (no-op if the library is already patched).
          sed -i -E 's/\bhal_init( *)\(/lmic_hal_init\1(/g' \
            "$lib"/src/hal/hal.cpp "$lib"/src/lmic/*.c "$lib"/src/lmic/*.h
          if grep -rnE '\bhal_init *\(' "$lib/src"; then
            echo "::error::hal_init still present in the LMiC"; exit 1
          fi

          # Region / radio of this build
          printf '%s\n' \
            '// project-specific definitions (written by the CI)' \
            '#define CFG_au915 1' \
            '#define CFG_sx1276_radio 1' > "$lib/project_config/lmic_project_config.h"

          echo "LMIC_LIB=$lib" >> "$GITHUB_ENV"

      - name: Firmware version
        shell: bash
        working-directory: ${{ env.SKETCH }}
        run: |
          if [ -f node_build.h ]; then
            sed -i -E "s|^(#define[[:space:]]+NODE_FW_VERSION[[:space:]]+).*|\1\"$FW_VERSION\"|" node_build.h
            grep -E '^#define[[:space:]]+NODE_FW_VERSION' node_build.h
          else
            echo "no node_build.h: version only in the file names"
          fi

      - name: Build
        shell: bash
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --library "$LMIC_LIB" \
            --output-dir "out-${{ matrix.target }}" \
            --warnings default \
            "$SKETCH" 2>&1 | tee build.log
          {
            echo "### ${{ matrix.board }}"
            echo '```'
            grep -E '^(Sketch uses|Global variables)' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: bash
        run: |
          t=${{ matrix.target }}
          o=out-$t
          s=$SKETCH.ino
          name="$PKG-$FW_VERSION-$t"
          d=dist/$t
          mkdir -p "$d"
          boot_app0="$HOME/.arduino15/packages/esp32/hardware/esp32/$ESP32_CORE/tools/partitions/boot_app0.bin"

          # 1) single image: write at 0x0 with any flasher (esptool, ESP Web Tools, Flash Download Tool)
          cp "$o/$s.merged.bin" "$d/$name-full.bin"

          # 2) application only: firmware update of a board that already runs this node (0x10000)
          cp "$o/$s.bin" "$d/$name-app.bin"

          # 3) separate parts + offsets, for esptool write_flash @flash_args
          p="$d/parts"
          mkdir -p "$p"
          cp "$o/$s.bootloader.bin" "$p/bootloader.bin"
          cp "$o/$s.partitions.bin" "$p/partition-table.bin"
          cp "$boot_app0"           "$p/boot_app0.bin"
          cp "$o/$s.bin"            "$p/$PKG.bin"
          printf '%s\n' \
            '--flash_mode dio --flash_freq 40m --flash_size 4MB' \
            '0x1000 bootloader.bin' \
            '0x8000 partition-table.bin' \
            '0xe000 boot_app0.bin' \
            "0x10000 $PKG.bin" > "$p/flash_args"
          (cd "$p" && python3 -m zipfile -c "../$name-parts.zip" ./*) && rm -rf "$p"

          ls -l "$d"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PKG }}-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..

          # notes = section "## vX.Y.Z" of CHANGELOG.md or doc/CHANGELOG.md (if present)
          : > notes.md
          for f in CHANGELOG.md doc/CHANGELOG.md; do
            [ -f "$f" ] || continue
            awk -v v="## v$VERSION" '
              index($0, v) == 1 { on = 1; next }
              on && /^(## |---)/ { exit }
              on { print }' "$f" > notes.md
            break
          done
          [ -s notes.md ] || echo "Firmware v$VERSION" > notes.md
          cat >> notes.md <<EOF

          ### Arquivos
          | Placa | Imagem única (gravar em 0x0) | Só a aplicação (0x10000) |
          |---|---|---|
          | ESP32 DevKit + RFM95W | \`$PKG-$VERSION-esp32-full.bin\` | \`$PKG-$VERSION-esp32-app.bin\` |

          \`$PKG-$VERSION-esp32-parts.zip\`: bootloader, tabela de partições, boot_app0 e aplicação separados, com os offsets em \`flash_args\`.

          Compilado com ESP32 Arduino core $ESP32_CORE e MCCI LMiC $LMIC_VERSION (AU915, SX1276).

          \`\`\`bash
          esptool.py --chip esp32 -p /dev/ttyUSB0 write_flash 0x0 $PKG-$VERSION-esp32-full.bin
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
